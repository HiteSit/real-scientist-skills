name: Frontmatter

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontmatter:
    name: SKILL.md frontmatter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The fork deletes Matt's package.json (fork-removed.txt); install only the parser his script imports.
      - name: Install yaml
        run: npm install --no-save --no-package-lock yaml@^2.9.1

      - name: Check frontmatter
        run: node scripts/check-frontmatter.mjs
